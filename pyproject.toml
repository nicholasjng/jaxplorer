[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaxplorer"
dynamic = ["version"]
description = "A compiler explorer TUI for inspecting compiled JAX programs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas Junge", email = "nicho.junge@gmail.com" }]
keywords = ["jax", "xla", "hlo", "compiler", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
dependencies = [
    # Hard floors: jax 0.8 and older emit no HLO stack-frame tables, so click-to-source silently finds nothing;
    # textual 5 and older lack Static.content, which the tests read to assert what a pane displays.
    "jax>=0.9",
    "textual>=6.0",
]

[project.urls]
Repository = "https://github.com/nicholasjng/jaxplorer"
Issues = "https://github.com/nicholasjng/jaxplorer/issues"

[project.scripts]
jaxplorer = "jaxplorer.cli:main"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
typing = [
    "ty>=0.0.42",
]

[tool.uv]
default-groups = ["test", "typing"]
# exclude dependency versions newer than one week
exclude-newer = "1 week"
# ...except the toolchain, which we want at the latest release.
exclude-newer-package = { ruff = false, ty = false }

[tool.hatch.version]
path = "src/jaxplorer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxplorer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Merge `from x import y` and `from x import z as z` into one statement
# instead of leaving the aliased form on its own line.
combine-as-imports = true

[tool.ty.src]
include = ["src", "tests"]
